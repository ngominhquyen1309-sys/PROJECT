<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/auth.css">
</head>

<body>
    <div class="form-container">
        <h2>Đăng nhập</h2>
        <p>Đăng nhập để sử dụng hệ thống</p>
        <form id="form">
            <label>Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email"><br />
            <small class="error error-email"></small>
            <div class="password-container">
                <label>Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"><br />
                <button type="button" id="togglePassword">👁</button>
                <small class="error error-password"></small>
            </div>
            <div class="remember-box">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Ghi nhớ đăng nhập trong 24 giờ</label>
            </div>

            <button type="submit" id="btnLogin">
                Login
            </button>

            <div class="extra-links">
                <a href="#">Forgot password?</a>
                <span>or</span>
                <a href="register.html">SignUp</a>
            </div>
        </form>
    </div>
    <script src="login.js"></script>
</body>

</html>
